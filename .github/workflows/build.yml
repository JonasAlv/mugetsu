name: Build Mugetsu (Linux CI)

on:
  push:
    branches:
      - skua-linux
      - main
    paths:
      - 'source/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - skua-linux
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Mugetsu (Ubuntu 22.04 / Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libfontconfig-dev libfreetype6-dev libssl-dev

      - name: Install Rust toolchain
        run: |
          version=$(tr -d '[:space:]' < source/RUST_VERSION)
          rustup toolchain install "$version" --profile minimal --no-self-update
          rustup default "$version"
          rustc --version

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Mugetsu
        run: bash source/build.sh

      - name: Verify build output
        run: |
          ls -la source/build/out/Mugetsu
          file source/build/out/Mugetsu
          sha256sum source/build/out/Mugetsu

      - name: Upload Mugetsu artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mugetsu-linux-x86_64
          path: source/build/out/Mugetsu
          if-no-files-found: error
