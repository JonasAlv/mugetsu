name: Build & Release Mugetsu (Linux)

on:
  push:
    branches:
      - skua-linux
      - skua-mugetsu
      - main
    paths:
      - 'source/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release Mugetsu (Ubuntu 22.04 / Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libfontconfig-dev libfreetype6-dev libssl-dev

      - name: Install Rust toolchain
        run: |
          version=$(tr -d '[:space:]' < source/RUST_VERSION)
          rustup toolchain install "$version" --profile minimal --no-self-update
          rustup default "$version"
          rustc --version

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Mugetsu
        run: bash source/build.sh

      - name: Verify build output
        run: |
          ls -la source/build/out/Mugetsu
          file source/build/out/Mugetsu
          sha256sum source/build/out/Mugetsu

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mugetsu-linux-x86_64
          path: source/build/out/Mugetsu
          if-no-files-found: error

      - name: Package Release Assets
        id: package
        run: |
          VERSION=$(sed -n 's/^pub const VERSION: &str = "\([^"]*\)";.*/\1/p' source/build/ruffle/desktop/src/mugetsu.rs 2>/dev/null || echo "1.5.1")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          mkdir -p package/Mugetsu/LICENSES release
          cp source/build/out/Mugetsu package/Mugetsu/
          cp -r source/release-linux/* package/Mugetsu/ 2>/dev/null || true
          cp -r source/release/LICENSES/* package/Mugetsu/LICENSES/ 2>/dev/null || true
          cp LICENSE package/Mugetsu/LICENSES/Mugetsu-LICENSE-GPL-3.0.txt 2>/dev/null || true

          ARCHIVE="Mugetsu-$VERSION-linux.tar.gz"
          tar -C package --owner=0 --group=0 --numeric-owner -czf "release/$ARCHIVE" Mugetsu

          cd release
          sha256sum "$ARCHIVE" > SHA256SUMS.txt
          sha256sum ../source/build/out/Mugetsu >> SHA256SUMS.txt
          cd ..

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          echo "Checking if release $TAG already exists..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading updated assets..."
            gh release upload "$TAG" \
              source/build/out/Mugetsu \
              "release/Mugetsu-$VERSION-linux.tar.gz" \
              release/SHA256SUMS.txt \
              --clobber
            gh release edit "$TAG" --latest --notes ""
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              source/build/out/Mugetsu \
              "release/Mugetsu-$VERSION-linux.tar.gz" \
              release/SHA256SUMS.txt \
              --title "Mugetsu $TAG" \
              --notes "" \
              --latest
          fi
          echo "Release $TAG published and marked latest successfully!"
