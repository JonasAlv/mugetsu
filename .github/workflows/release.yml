name: Release Mugetsu (Linux)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v1.5.1). Leave blank to auto-derive from mugetsu.rs'
        required: false
        default: ''
      title:
        description: 'Release title (leave blank for "Mugetsu <tag>")'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      make_latest:
        description: 'Mark as latest release (for package-linux.sh)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Linux Release
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libfontconfig-dev libfreetype6-dev libssl-dev

      - name: Install Rust toolchain
        run: |
          version=$(tr -d '[:space:]' < source/RUST_VERSION)
          rustup toolchain install "$version" --profile minimal --no-self-update
          rustup default "$version"
          rustc --version

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Mugetsu
        run: bash source/build.sh

      - name: Determine Version and Tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            VERSION="${TAG#v}"
          else
            VERSION=$(sed -n 's/^pub const VERSION: &str = "\([^"]*\)";.*/\1/p' source/build/ruffle/desktop/src/mugetsu.rs 2>/dev/null || echo "1.5.1")
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release Tag: $TAG (Version: $VERSION)"

      - name: Package Release Assets
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p package/Mugetsu/LICENSES release
          
          # Standalone executable binary
          cp source/build/out/Mugetsu package/Mugetsu/
          cp -r source/release-linux/* package/Mugetsu/ 2>/dev/null || true
          cp -r source/release/LICENSES/* package/Mugetsu/LICENSES/ 2>/dev/null || true
          cp LICENSE package/Mugetsu/LICENSES/Mugetsu-LICENSE-GPL-3.0.txt 2>/dev/null || true
          
          ARCHIVE="Mugetsu-$VERSION-linux.tar.gz"
          tar -C package --owner=0 --group=0 --numeric-owner -czf "release/$ARCHIVE" Mugetsu
          
          # Generate SHA256 sums
          cd release
          sha256sum "$ARCHIVE" > SHA256SUMS.txt
          sha256sum ../source/build/out/Mugetsu >> SHA256SUMS.txt
          cd ..
          
          echo "Assets prepared:"
          ls -la source/build/out/Mugetsu release/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES_ARGS=()
          if [ -f "source/notes/$VERSION.md" ]; then
            NOTES_ARGS=(--notes-file "source/notes/$VERSION.md")
          else
            NOTES_ARGS=(--notes "Automated release of Mugetsu $VERSION for Linux / VibeSkua.")
          fi

          FLAGS=()
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          if [ "${{ github.event.inputs.make_latest }}" != "false" ]; then
            FLAGS+=(--latest)
          fi

          TITLE="${{ github.event.inputs.title }}"
          if [ -z "$TITLE" ]; then
            TITLE="Mugetsu $TAG (Linux)"
          fi

          echo "Checking if release $TAG already exists..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" \
              source/build/out/Mugetsu \
              "release/Mugetsu-$VERSION-linux.tar.gz" \
              release/SHA256SUMS.txt \
              --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              source/build/out/Mugetsu \
              "release/Mugetsu-$VERSION-linux.tar.gz" \
              release/SHA256SUMS.txt \
              --title "$TITLE" \
              "${NOTES_ARGS[@]}" \
              "${FLAGS[@]}"
          fi
          echo "Release $TAG published successfully!"
